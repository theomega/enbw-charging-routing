name = "charging-routing"
main = "worker/index.ts"
compatibility_date = "2026-09-10"

# The EnBW subscription key is NOT stored here. Set it once with:
#   pnpm wrangler secret put ENBW_SUBSCRIPTION_KEY
# For local `wrangler dev`, put it in .dev.vars (gitignored):
#   ENBW_SUBSCRIPTION_KEY=...

# The built frontend ships in the same deployment as the Worker, so the two
# share an origin and the client's relative `/api/chargers/:id` fetch resolves
# without a configured base URL (src/services/enbw/availability.ts).
#
# Routing is asset-first: Cloudflare matches a file in ./dist and only invokes
# the Worker when there is none. Assets served this way never enter the Worker,
# so the bundle and the station list cost no invocations.
#
# There is deliberately no SPA fallback. The app has no client-side routing --
# no history, no path or query state, every view is React state at `/` -- so
# nothing ever requests a path that is not a file, and answering misses with
# index.html only made them lie: a dead asset URL left over from an earlier
# deploy came back as 200 HTML, which the browser then cached for a year under
# the immutable rule meant for real assets. `404-page` serves ./dist/404.html
# with a 404 instead, and the asset router answers it without waking the Worker.
#
# That makes `run_worker_first` load-bearing rather than a workaround: /api/* is
# no file, so without it the API would be answered by the 404 page.
[assets]
directory = "./dist"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true
