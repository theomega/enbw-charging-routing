name = "charging-routing"
main = "worker/index.ts"
compatibility_date = "2026-09-10"

# The EnBW subscription key is NOT stored here. Set it once with:
#   pnpm wrangler secret put ENBW_SUBSCRIPTION_KEY
# For local `wrangler dev`, put it in .dev.vars (gitignored):
#   ENBW_SUBSCRIPTION_KEY=...

# The built frontend ships in the same deployment as the Worker, so the two
# share an origin and the client's relative `/api/chargers/:id` fetch resolves
# without a configured base URL (src/services/enbw/availability.ts).
#
# Routing is asset-first: Cloudflare matches a file in ./dist and only invokes
# the Worker when there is none. `single-page-application` turns that miss into
# index.html, which would swallow the API route -- hence `run_worker_first`,
# which sends /api/* straight to the Worker and leaves every other path to the
# asset router. Assets served this way never enter the Worker, so the station
# list and the bundle cost no invocations.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true
