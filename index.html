<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Deliberately not `black-translucent` together with `viewport-fit=cover`.
      That pair lets the web view draw under the notch, and iOS lays `fixed` and
      `sticky` elements out against the viewport rather than against the padded
      body — so every pinned header ended up under the status bar once the app
      was installed to the home screen, including the one carrying "Zurück".
      Letting iOS reserve the status bar itself keeps the safe-area insets at
      zero and no layout code has to know about notches.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ladestopp" />
    <!--
      iOS ignores the manifest's SVG icon and needs its own PNG, otherwise the
      home screen shows a screenshot of the page instead of the app icon.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Ladestopp — ENBW</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
